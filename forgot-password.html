<!DOCTYPE html> <!-- מגדיר לדפדפן שהמסמך מסוג HTML -->
<html lang="en"> <!-- הגדרת שפה, אנגלית -->
<head> <!--   תחילת אזור ראש, מכיל מידע רקע והגדרות לדפדפן שאינפ מוצגים למשתמש -->
    <meta charset="UTF-8"> <!-- מגדיר קידוד תווים אוניברסלי על מנת שכל השפות והסימנים יוצגו באופן תקין -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- הופך את האתר לקספונסיבי - מתאים למובייל ולמסמכים שונים -->
    <title>Lmap - Forgot Password</title> <!-- קביעת כותבת שתופיע בלשונית של הדפדפן -->
    <link rel="stylesheet" href="style.css"> <!--  מקשר את דף הHTML לקובץ העיצוב החיצוני (css)-->
</head>
<body> <!-- תחילת גוף הדף, התכון שהמשתמש רואה על המסך -->
    <div class="background-shapes"> <!-- תיבה ראשית שמחזיקה את האלמנטים העיצוביים של הרקע -->
        <div class="shape shape-1"></div> <!-- צורה עיצובית ראשונה ברקע -->
        <div class="shape shape-2"></div> <!-- צורה עיצובית שנייה ברקע -->
    </div> <!-- סיום תיבת הרקע -->

    <div class="auth-container"> <!-- התיבה המרכזית שמחזיקה את כל תוכן הטופס -->
        <div class="brand-logo">Lmap</div> <!-- מציג את שם המותג של האתר -->
        <h1>Reset Your Password</h1> <!-- כותרת ראשית -->
        <p class="auth-subtitle">Enter your details to verify your account</p> <!-- תיבת הסברה למשתמש -->

        <form id="forgotPasswordForm"> <!-- ריכוז את הקלט ולהעביר במזהה יחודי לJS -->
            <div class="input-group">
                <input type="text" placeholder="Username" id="reset-username" required> <!-- שדה טקסט להזנת שם משתמש, שדה חובה -->
            </div> <!-- סיום תיבת שדה הקלט הראשון -->
            <div class="input-group">
                <input type="email" placeholder="Email Address" id="reset-email" required> <!-- שדה להזנת אימייל, שדה חובה -->
            </div>
            <button type="submit" class="btn btn-primary" id="resetSubmitButton">Verify Account</button> <!-- כפתור מסוג שליחה שמפעיל את הטופס -->
        </form>
        <p class="auth-redirect">Remembered your password? <a href="login.html">Login here</a></p> <!-- קישור שמפנה חזרה לדף ההתחברות -->
    </div>
    <script src="script.js"></script> <!-- קישור האתר לקובץJS -->
</body>
</html>
