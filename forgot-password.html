<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lmap - Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="auth-container">
        <div class="brand-logo">Lmap</div>
        <h1>Reset Your Password</h1>
        <p class="auth-subtitle">Enter your details to verify your account</p>

        <form id="forgotPasswordForm">
            <div class="input-group">
                <input type="text" placeholder="Username" id="reset-username" required>
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email Address" id="reset-email" required>
            </div>
            <button type="submit" class="btn btn-primary" id="resetSubmitButton">Verify Account</button>
        </form>
        <p class="auth-redirect">Remembered your password? <a href="login.html">Login here</a></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
