<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lmap - Create New Password</title>
    <link rel="stylesheet" href="style.css"> <!-- חיבור לקובץ העיצוב המקורי של האתר - שומר על 100% אחידות עיצובית -->
</head>
<body>
    <!-- צורות הרקע הגיאומטריות שזזות מאחורי הזכוכית (זהה לחלוטין לרישום ולוגאין) -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <!-- התיבה המרכזית המעוצבת כמו זכוכית חלבית -->
    <div class="auth-container">
        <div class="brand-logo">Lmap</div>
        <h1>Create New Password</h1>
        <p class="auth-subtitle">Please enter your secure new password</p>

        <form id="setNewPasswordForm">
            <div class="input-group">
                <input type="password" placeholder="New Password" id="new-password" required>
            </div>

            <!-- הוספת הבלוק הוויזואלי: רשימת תנאי הסיסמה המשתנים בזמן אמת מאדום לירוק -->
            <div class="password-requirements">
                <p id="new-req-length" class="req-item invalid">✖ Between 6 to 15 characters</p>
                <p id="new-req-uppercase" class="req-item invalid">✖ At least one uppercase letter (A-Z)</p>
                <p id="new-req-number" class="req-item invalid">✖ At least one number (0-9)</p>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Confirm New Password" id="confirm-new-password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="saveNewPasswordButton">Update Password</button>
        </form>
    </div>

    <script>
        // ====================================================================
        // 🔒 קוד חדש: פונקציית עזר מובנית בדפדפן לביצוע הצפנת SHA-256 אסינכרונית
        // ====================================================================
        async function hashSHA256(text) {
            if (!text) return "";
            const encoder = new TextEncoder(); // הופך את מחרוזת הטקסט למערך של bytes
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data); // ביצוע הגיבוב המאובטח בדפדפן
            const hashArray = Array.from(new Uint8Array(hashBuffer)); // המרת ה-Buffer למערך מספרים רגיל
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join(''); // הפיכת המערך למחרוזת הטקסט המוצפנת הסופית
        }

        // שליפת שם המשתמש מתוך הכתובת (URL) שהגיע מהמייל
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('username');

        const newPasswordInput = document.getElementById('new-password');
        const reqLength = document.getElementById('new-req-length');
        const reqUppercase = document.getElementById('new-req-uppercase');
        const reqNumber = document.getElementById('new-req-number');

        // האזנה להקלדה בזמן אמת ושינוי צבעים מאדום לירוק מנטה
        if (newPasswordInput) {
            newPasswordInput.addEventListener('input', function() {
                const val = newPasswordInput.value;
                if (val.length >= 6 && val.length <= 15) {
                    reqLength.classList.remove('invalid'); reqLength.classList.add('valid');
                    reqLength.innerText = '✔ Between 6 to 15 characters';
                } else {
                    reqLength.classList.remove('valid'); reqLength.classList.add('invalid');
                    reqLength.innerText = '✖ Between 6 to 15 characters';
                }
                if (/[A-Z]/.test(val)) {
                    reqUppercase.classList.remove('invalid'); reqUppercase.classList.add('valid');
                    reqUppercase.innerText = '✔ At least one uppercase letter (A-Z)';
                } else {
                    reqUppercase.classList.remove('valid'); reqUppercase.classList.add('invalid');
                    reqUppercase.innerText = '✖ At least one uppercase letter (A-Z)';
                }
                if (/[0-9]/.test(val)) {
                    reqNumber.classList.remove('invalid'); reqNumber.classList.add('valid');
                    reqNumber.innerText = '✔ At least one number (0-9)';
                } else {
                    reqNumber.classList.remove('valid'); reqNumber.classList.add('invalid');
                    reqNumber.innerText = '✖ At least one number (0-9)';
                }
            });
        }

        // 🔧 תיקון: הוספת מילת המפתח async כדי שנוכל להפעיל את פונקציית ההצפנה האסינכרונית בפנים
        document.getElementById('setNewPasswordForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const newPassword = newPasswordInput.value;
            const confirmNewPassword = document.getElementById('confirm-new-password').value;

            if (newPassword !== confirmNewPassword) { alert('שגיאה: הסיסמאות אינן תואמות!'); return; }
            if (newPassword.length < 6 || newPassword.length > 15 || !/[A-Z]/.test(newPassword) || !/[0-9]/.test(newPassword)) {
                alert('שגיאה: הסיסמה אינה עומדת בדרישות האבטחה!'); return;
            }

            // ====================================================================
            // 🔒 קוד חדש: הצפנת הסיסמה החדשה ב-SHA-256 לפני שהיא נשלחת ברשת לשרת
            // ====================================================================
            const encryptedNewPassword = await hashSHA256(newPassword);

            fetch('http://localhost:5000/api/update-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // 🔧 תיקון: שליחת המשתנה המוצפן encryptedNewPassword במקום הסיסמה הגלויה
                body: JSON.stringify({ username: username, newPassword: encryptedNewPassword })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('הסיסמה עודכנה בהצלחה בשרת! כעת תועבר למסך ההתחברות.');
                    window.location.href = 'login.html'; // מחזיר אותך אוטומטית לעמוד הלוגאין המקורי שלך
                }
            });
        });
    </script>
</body>
</html>
